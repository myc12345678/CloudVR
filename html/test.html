<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godot WebRTC Stream Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="assignErrorPage" class="assign-error" style="display:none;">
    <div class="assign-error-card">
      <div class="assign-error-title">无法接入会话</div>
      <p class="assign-error-msg">当前所有用户槽位已满，暂时无法为你分配会话。</p>
      <p class="assign-error-detail" id="assignErrorDetail"></p>
      <p class="assign-error-hint">请稍后刷新页面重试，或联系管理员扩容。</p>
    </div>
  </div>

  <div class="page">
    <main class="app-main">
      <section class="viewer">
        <div class="video-panel">
          <div class="video-shell">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <div class="video-idle" id="videoIdle">
              <svg class="spinner" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6" /></svg>
              <span>等待视频流…</span>
            </div>
            <div class="video-overlay">
              <div class="video-controls">
                <button class="primary" id="playButton" title="浏览器自动播放策略可能阻止自动播放，可手动点击播放">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                  <span>开始播放</span>
                </button>
                <button class="secondary" id="fullscreenButton">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M16 3h3a2 2 0 0 1 2 2v3" /><path d="M8 21H5a2 2 0 0 1-2-2v-3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
                  <span id="fullscreenLabel">全屏</span>
                </button>
                <button class="secondary" id="clearLogButton">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg>
                  <span>清空日志</span>
                </button>
              </div>
              <div class="video-bottom">
                <div class="video-meta">
                  <div class="pill">Peer: <strong id="peerLabel">cpp_sender</strong></div>
                  <div class="pill">Viewer: <strong id="selfLabel">browser</strong></div>
                </div>
                <div class="pill" id="resolutionBadge">分辨率: --</div>
              </div>
            </div>
          </div>
        </div>

        <div class="status-bar">
          <div class="status-row status-latency-row">
            <div class="status-item latency-item">
              <span class="status-name">延迟</span>
              <span class="status-value latency-value" id="latencyValue">-- ms</span>
              <span class="latency-detail" id="latencyDetail"></span>
            </div>
          </div>
          <div class="status-row status-info-row">
            <div class="status-item status-pill">
              <span class="status-name">总状态</span>
              <span class="status-value" id="overallBadge">初始化中</span>
            </div>
            <div class="status-item status-pill">
              <span class="status-name">视频流</span>
              <span class="status-value" id="streamBadge">等待视频轨…</span>
            </div>
            <div class="status-item">
              <span class="dot" id="wsDot"></span>
              <span class="status-name">WS</span>
              <span class="status-value" id="wsStatus">connecting</span>
            </div>
            <div class="status-item">
              <span class="dot" id="pcDot"></span>
              <span class="status-name">PC</span>
              <span class="status-value" id="pcStatus">new</span>
            </div>
            <div class="status-item">
              <span class="dot" id="iceDot"></span>
              <span class="status-name">ICE</span>
              <span class="status-value" id="iceStatus">new</span>
            </div>
            <div class="status-item">
              <span class="dot" id="videoDot"></span>
              <span class="status-name">视频</span>
              <span class="status-value" id="videoStatus">idle</span>
            </div>
            <div class="status-spacer"></div>
            <div class="status-item">
              <span class="status-name">用户</span>
              <span class="status-value" id="userIndexText">--</span>
            </div>
            <div class="status-item">
              <span class="status-name">Peer</span>
              <span class="status-value" id="peerIdText">--</span>
            </div>
            <div class="status-item">
              <span class="status-name">本机</span>
              <span class="status-value" id="selfIdText">--</span>
            </div>
            <div class="status-item status-url" title="信令地址">
              <span class="status-name">信令</span>
              <span class="status-value" id="wsUrlText"></span>
            </div>
          </div>
        </div>
      </section>

      <aside class="logs-panel collapsed" id="logsPanel">
        <button class="logs-handle" id="logsToggle" aria-expanded="false">
          <span class="logs-handle-label">运行日志</span>
          <span class="logs-count" id="logCount">0</span>
          <span class="logs-arrow" id="logsArrow">‹</span>
          <span class="logs-badge" id="logCountBadge">0</span>
        </button>
        <div class="logs-body" id="logsBody">
          <div class="log-box" id="logBox"></div>
          <div class="footer-note">
            日志会同时输出到浏览器控制台和页面内面板，便于演示与调试。
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
