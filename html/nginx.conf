
#user http;
worker_processes  1;

error_log  /home/myc/Develop/cloudvr/html/logs/error.log notice;

pid        /home/myc/Develop/cloudvr/html/logs/nginx.pid;


# Load all installed modules
include modules.d/*.conf;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 临时目录改到仓库内：/var/lib/nginx 为 root:root，普通用户无法创建，
    # 会导致 `nginx -t` 报 mkdir() ... Permission denied。改到这里后可免 sudo 运行。
    client_body_temp_path /home/myc/Develop/cloudvr/html/logs/client_body;
    proxy_temp_path       /home/myc/Develop/cloudvr/html/logs/proxy;
    fastcgi_temp_path     /home/myc/Develop/cloudvr/html/logs/fastcgi;
    uwsgi_temp_path       /home/myc/Develop/cloudvr/html/logs/uwsgi;
    scgi_temp_path        /home/myc/Develop/cloudvr/html/logs/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /home/myc/Develop/cloudvr/html/logs/access.log;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       8080;
        server_name  127.0.0.1;

        return 301 https://$host:8444$request_uri;
    }

    server {
        listen       8444 ssl;
        server_name  127.0.0.1;

        ssl_certificate      /home/myc/Develop/cloudvr/signalling-server/certs/dev-cert.pem;
        ssl_certificate_key  /home/myc/Develop/cloudvr/signalling-server/certs/dev-key.pem;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            root   /home/myc/Develop/cloudvr/html/;
            index  test.html;
        }

        # 运行时配置：script.js 通过 fetch('/config.json') 读取仓库根目录的 config.json。
        # 该文件含机台路径，已 gitignore，不入库（模板为 config.json.example）。
        location = /config.json {
            alias /home/myc/Develop/cloudvr/config.json;
        }

        location /ws {
            proxy_pass https://127.0.0.1:8443;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 长连接超时：1 小时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_ssl_verify off;
            proxy_ssl_server_name on;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

}
